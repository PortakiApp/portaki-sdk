[package]
name = "portaki-test-utils"
description = "In-process mock host and SDUI assertions for Portaki module unit tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/portaki-test-utils"
categories = ["development-tools::testing", "wasm"]
keywords = ["portaki", "testing", "mock", "wasm", "sdui"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
# Every host API: the mock serves them all, whichever module is under test.
portaki-sdk = { workspace = true, features = ["kv", "repo", "email", "events", "platform", "guest-files"] }
# The `mock` feature is only ever turned on from here: this crate is never anything but a
# dev-dependency of a module, so the canned responses are not compiled into the wasm.
portaki-connectors = { workspace = true, features = ["mock"] }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
# The conformance suite validates `portaki.module.json` against the embedded schema: no network
# resolution, hence without the default features (reqwest, rustls).
jsonschema = { version = "0.56", default-features = false }
