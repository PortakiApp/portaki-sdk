[package]
name = "portaki-test-utils"
description = "In-process mock host and SDUI assertions for Portaki module unit tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/portaki-test-utils"
categories = ["development-tools::testing", "wasm"]
keywords = ["portaki", "testing", "mock", "wasm", "sdui"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
# Toutes les API hôte : le mock les sert toutes, quel que soit le module testé.
portaki-sdk = { workspace = true, features = ["kv", "repo", "email", "events", "platform", "guest-files"] }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
# La batterie de conformité valide `portaki.module.json` contre le schéma embarqué : pas de
# résolution réseau, donc sans les features par défaut (reqwest, rustls).
jsonschema = { version = "0.56", default-features = false }
