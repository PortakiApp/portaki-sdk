[package]
name = "portaki-connectors"
description = "Typed built-in Portaki connector operations (OpenWeather, Mapbox, Places, Nominatim)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/portaki-connectors"
categories = ["api-bindings", "wasm"]
keywords = ["portaki", "connector", "weather", "mapbox", "wasm"]

[features]
# Les réponses simulées des connecteurs (`mock::ALL`). Jamais par défaut : seul
# `portaki-test-utils`, une dev-dependency, l'active — le wasm publié ne la voit pas.
mock = []

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
portaki-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
