[package]
name = "portaki-sdk"
description = "Authoring toolkit for Portaki Extism Wasm modules — host APIs, SDUI catalog, and manifest macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/portaki-sdk"
categories = ["wasm", "api-bindings", "development-tools"]
keywords = ["portaki", "wasm", "extism", "sdui", "module"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

# Une feature par permission du manifeste : l'API hôte qu'elle garde n'existe qu'avec elle, et
# `portaki build` lit les features activées pour écrire `permissions` — le compilateur garantit
# que la liste dit vrai. `connectors:<id>` n'en a pas : les macros de connecteur le déclarent.
[features]
kv = []
repo = []
email = []
events = []
platform = []
# Ces deux-là ne gardent aucune API : elles déclarent seulement la permission. `FileRef` sert aussi
# aux photos que l'hôte joint (checklist) ; la plateforme refuse l'upload voyageur sans
# `guest:files`, et laisse StayContext::guest_email / guest_phone vides sans la seconde.
guest-files = []
stay-guest-contact = []

[dependencies]
portaki-sdk-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
getrandom = { workspace = true }
chrono = { workspace = true }
inventory = "0.3.24"

[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.23"
extism-pdk = "1.4.1"

[build-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Les tests du SDK exercent toute l'API hôte, quelle que soit la feature demandée.
portaki-sdk = { path = ".", features = ["kv", "repo", "email", "events", "platform", "guest-files"] }
serde_json = { workspace = true }
trybuild = "1.0.120"
# Lit `sdui/common.rs` et `sdui/action.rs` pour en dériver `contracts/sdui_types.json`.
# Dev uniquement : rien de tout ceci n'entre dans le Wasm d'un module.
syn = { version = "2", features = ["full", "parsing", "printing", "extra-traits"] }
quote = "1"
