[package]
name = "portaki-sdk"
description = "Authoring toolkit for Portaki Extism Wasm modules — host APIs, SDUI catalog, and manifest macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/portaki-sdk"
categories = ["wasm", "api-bindings", "development-tools"]
keywords = ["portaki", "wasm", "extism", "sdui", "module"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

# One feature per manifest permission: the host API it guards only exists with it, and
# `portaki build` reads the enabled features to write `permissions` — the compiler is what
# guarantees the list tells the truth. `connectors:<id>` has none: the connector macros declare it.
[features]
kv = []
repo = []
email = []
events = []
platform = []
# These two guard no API: they only declare the permission. `FileRef` also serves the photos the
# host attaches (checklist); the platform refuses a guest upload without `guest:files`, and leaves
# StayContext::guest_email / guest_phone empty without the second one.
guest-files = []
# Lire les octets d'un fichier joint par l'hôte à ce module (`host::files::read`).
host-files = []
stay-guest-contact = []

[dependencies]
portaki-sdk-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
getrandom = { workspace = true }
chrono = { workspace = true }
inventory = "0.3.24"

[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.23"
extism-pdk = "1.4.1"

[build-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The SDK's tests exercise the whole host API, whichever feature is asked for.
portaki-sdk = { path = ".", features = ["kv", "repo", "email", "events", "platform", "guest-files"] }
serde_json = { workspace = true }
trybuild = "1.0.120"
# Reads `sdui/common.rs` and `sdui/action.rs` to derive `contracts/sdui_types.json` from them.
# Dev only: none of this ends up in a module's Wasm.
syn = { version = "2", features = ["full", "parsing", "printing", "extra-traits"] }
quote = "1"
