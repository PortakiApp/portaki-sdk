[package]
name = "portaki-cli"
description = "Portaki module CLI (portaki) — init, build, lint, test, and OCI publish"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/portaki-cli"
categories = ["command-line-utilities", "development-tools", "wasm"]
keywords = ["portaki", "cli", "wasm", "oci", "extism"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[[bin]]
name = "portaki"
path = "src/main.rs"
doc = false

[dependencies]
portaki-sdk = { workspace = true }
# `portaki lint` valide le manifeste publié contre le schéma embarqué par la batterie de
# conformité — le même contrôle, pas une copie de plus du schéma.
portaki-test-utils = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
walkdir = { workspace = true }
glob = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
reqwest = { workspace = true }
oci-distribution = { workspace = true }
include_dir = { workspace = true }
base64 = "0.23"
toml_edit = "0.25"
notify = { workspace = true }
keyring = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
console = "0.16.4"
indicatif = "0.18.4"
open = "5.4.3"

[dev-dependencies]
tempfile = "3"
jsonschema = { version = "0.56", default-features = false }
