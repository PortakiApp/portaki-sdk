name: release

# Publie ce module quand un tag `v*` est poussé.
#
# Tout le travail est dans `portaki-release-action` : compiler en wasm32, valider le manifeste,
# pousser l'artefact OCI, annoncer la version au registre, et avertir de ce qui vieillit. Ce
# fichier ne dit que *quand*.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  # Sans ce droit, GitHub n'émet aucun jeton OIDC et il n'y a rien à échanger contre un
  # credential de publication. C'est ce jeton qui remplace un secret longue durée : il n'y a
  # rien à ranger dans les secrets du dépôt.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # La liaison enregistrée au registre exige un environment sur le canal stable : c'est lui
    # qui porte les relecteurs obligatoires. Sans lui l'échange est refusé —
    # `environment_required`. Liez d'abord ce module à ce dépôt depuis le dashboard.
    environment: release
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: PortakiApp/portaki-release-action@v1
