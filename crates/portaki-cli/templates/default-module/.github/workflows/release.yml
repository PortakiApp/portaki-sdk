name: release

# Publishes this module when a `v*` tag is pushed, in two jobs.
#
# `build` runs the module's code — tests, conformance suite, `build.rs`, wasm32 build — with no
# permissions at all. `release` holds the publishing permissions and runs none of the module's
# code, not even cargo: it audits `Cargo.lock` (`cargo audit`), pushes `build`'s artefact to
# Portaki's OCI repository with a short-lived push grant the registry issues it, signs it
# keylessly with this workflow's provenance and the audit report, and announces the version.
#
# Portaki production only runs an artefact signed by the workflow bound to this module: this
# file, in this repository. No secret to store: the job's OIDC token takes the place of all of
# them.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          # The `portaki release` gate runs `cargo fmt --check` and `cargo clippy`: without
          # these components it refuses before it even gets to the tests.
          components: rustfmt, clippy

      # The gate (formatting, clippy, tests, build --release, manifest, texts), then packaging;
      # the artefact goes on to the next job.
      - uses: PortakiApp/portaki-release-action/build@ab76c697ec3459805675a884a925b63a1ea612f8 # v2

  release:
    needs: build
    runs-on: ubuntu-latest
    # Stable is published from the GitHub `release` environment, which the registry binding
    # requires: it is what carries the mandatory reviewers. Without it the exchange is refused —
    # `environment_required`. Create it under Settings → Environments, then bind this module to
    # this repository from the developer space.
    environment: release
    permissions:
      contents: read
      # Without this permission, GitHub issues no OIDC token: nothing to exchange for a push
      # grant, and no identity to sign with.
      id-token: write
    # One publication at a time: two jobs pushing the same version would fight over its tag.
    concurrency:
      group: portaki-release
      cancel-in-progress: false
    steps:
      # The sources are read (Cargo.lock, CHANGELOG, listing.json), never compiled.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: PortakiApp/portaki-release-action@ab76c697ec3459805675a884a925b63a1ea612f8 # v2
        with:
          # A vulnerability of this severity (CVSS) stops the release; below it, and for an
          # informational advisory (unmaintained crate), a warning only.
          audit-fail-on: critical
