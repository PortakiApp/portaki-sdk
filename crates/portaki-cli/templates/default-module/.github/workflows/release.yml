name: release

# Publie ce module quand un tag `v*` est poussé, en deux jobs.
#
# `build` exécute le code du module — tests, batterie de conformité, `build.rs`, build wasm32 —
# sans aucun droit. `release` détient les droits de publication et n'exécute rien du module, pas
# même cargo : il audite `Cargo.lock` (`cargo audit`), pousse l'artefact de `build` dans le dépôt
# OCI de Portaki avec un droit de push court que le registre lui délivre, le signe sans clé avec
# la provenance de ce workflow et le rapport d'audit, et annonce la version.
#
# La production Portaki n'exécute qu'un artefact signé par le workflow lié à ce module : ce
# fichier, dans ce dépôt. Aucun secret à ranger : le jeton OIDC du job remplace tout.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
          # La porte de `portaki release` joue `cargo fmt --check` et `cargo clippy` : sans ces
          # composants, elle refuse avant même les tests.
          components: rustfmt, clippy

      # La porte (format, clippy, tests, build --release, manifeste, textes), puis l'emballage ;
      # l'artefact part au job suivant.
      - uses: PortakiApp/portaki-release-action/build@v2

  release:
    needs: build
    runs-on: ubuntu-latest
    # La stable se publie depuis l'environnement GitHub `release`, que la liaison au registre
    # exige : c'est lui qui porte les relecteurs obligatoires. Sans lui l'échange est refusé —
    # `environment_required`. Créez-le dans Settings → Environments, puis liez ce module à ce
    # dépôt depuis l'espace développeur.
    environment: release
    permissions:
      contents: read
      # Sans ce droit, GitHub n'émet aucun jeton OIDC : rien à échanger contre un droit de push,
      # et aucune identité pour signer.
      id-token: write
    # Une publication à la fois : deux jobs qui poussent la même version se disputeraient son tag.
    concurrency:
      group: portaki-release
      cancel-in-progress: false
    steps:
      # Les sources sont lues (Cargo.lock, CHANGELOG, listing.json), jamais compilées.
      - uses: actions/checkout@v6

      - uses: PortakiApp/portaki-release-action@v2
        with:
          # Une vulnérabilité de cette gravité (CVSS) arrête la release ; en dessous, et pour un
          # avis informationnel (crate non maintenue), un avertissement seulement.
          audit-fail-on: critical
