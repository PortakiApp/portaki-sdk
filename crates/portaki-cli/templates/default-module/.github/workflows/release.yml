name: release

# Publie ce module quand un tag `v*` est poussé.
#
# Tout le travail est dans `portaki-release-action` : auditer les dépendances (`cargo audit`),
# compiler en wasm32, valider le manifeste, pousser l'artefact OCI, le signer sans clé avec sa
# provenance et son rapport d'audit, annoncer la version au registre, et avertir de ce qui
# vieillit. Ce fichier ne dit que *quand*.
#
# La production Portaki n'exécute qu'un artefact signé par le workflow lié à ce module : ce
# fichier, dans ce dépôt. Un artefact poussé à la main sur GHCR n'y tournera pas.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # L'artefact, et sa signature poussée à côté.
  packages: write
  # Sans ce droit, GitHub n'émet aucun jeton OIDC : rien à échanger contre un credential de
  # publication, et aucune identité pour signer. C'est ce jeton qui remplace un secret longue
  # durée et une clé de signature : il n'y a rien à ranger dans les secrets du dépôt.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # La liaison enregistrée au registre exige un environment sur le canal stable : c'est lui
    # qui porte les relecteurs obligatoires. Sans lui l'échange est refusé —
    # `environment_required`. Liez d'abord ce module à ce dépôt depuis le dashboard.
    environment: release
    steps:
      - uses: actions/checkout@v6

      # Épinglées par SHA : ce job détient les droits de publication, une étiquette déplacée
      # exécuterait ici le code de quelqu'un d'autre.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: PortakiApp/portaki-release-action@c85597f78af82c5d3886644847e96977d7864298 # v1
        with:
          # Une vulnérabilité de cette gravité (CVSS) arrête la release ; en dessous, et pour un
          # avis informationnel (crate non maintenue), un avertissement seulement.
          audit-fail-on: critical
          # Le build de ce job exécute le code du module (build.rs) : un binaire `portaki` mis en
          # cache après lui ne se relit pas au release suivant.
          cache: "false"
