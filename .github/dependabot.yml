# Il n'y en avait pas.
#
# Les alertes Dependabot sont actives sur ce dépôt (il est public, c'est le défaut), mais une
# alerte signale ; elle ne propose rien. Sans ce fichier, aucune montée de version n'arrive
# jamais sous forme de PR, et c'est ainsi qu'une dépendance dérive pendant des mois.
version: 2

updates:
  # Un seul workspace cargo à la racine : le verrou est partagé par les cinq crates.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dependances-mineures:
        update-types: [minor, patch]

  # Ces workflows publient sur crates.io et poussent des contrats au registre : une action
  # compromise s'exécute avec ces droits-là.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
