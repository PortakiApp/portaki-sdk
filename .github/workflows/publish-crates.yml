name: Publish crates.io

# Runs after release-please creates tag vX.Y.Z (push tag).
# Auth: Trusted Publishing OIDC — rust-lang/crates-io-auth-action.
# Workspace order: cargo-workspaces (topological `cargo ws publish`).
#
# Bootstrap (once per crate, before OIDC works):
#   1. Publish manually with a crates.io API token (see docs/RELEASE.md)
#   2. crates.io → Settings → Trusted Publishing → Add GitHub
#      owner: PortakiApp, repo: portaki-sdk, workflow: publish-crates.yml
on:
  push:
    tags:
      - "v*"
  # Resume a partial publish (e.g. after a mid-workspace failure) without retagging — run it
  # on the tag: the job refuses any other ref.
  workflow_dispatch:

concurrency:
  group: publish-crates.io
  # Never cancel: crates.io versions are immutable, and an interrupted workspace publish leaves
  # some crates at the new version and the rest behind, with no way to republish them.
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish
    # A tag, never a branch: crates.io versions are immutable, and a dispatch from a branch
    # published whatever that branch held under the workspace version.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Trusted Publishing on crates.io is bound to this environment, which only deploys `v*` tags.
    environment: crates-io
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install cargo-workspaces
        run: cargo install cargo-workspaces --version 0.4.2 --locked

      - id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          cargo ws publish \
            --publish-as-is \
            --publish-interval 15 \
            --yes
