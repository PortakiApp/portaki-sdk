# A CVE comes out without anyone pushing a commit.
#
# CI only ran on `push` and `pull_request`: a RustSec advisory published on a Tuesday about a
# dependency nobody has touched in six months would have triggered nothing at all. Hence the
# `schedule`, which is the heart of this file; the PR trigger only moves the signal closer to
# the moment you can still avoid the problem.
#
# This repo publishes to crates.io: whatever is vulnerable here gets reinstalled by the modules'
# CI and by every third-party author.
name: security-audit

on:
  schedule:
    # 06:20 UTC — offset from the top of the hour, when the Actions queue is busiest.
    - cron: "20 6 * * *"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The action opens an issue when it finds something on the scheduled run — without this, the
  # finding stays in a log nobody reads back.
  issues: write
  checks: write

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
