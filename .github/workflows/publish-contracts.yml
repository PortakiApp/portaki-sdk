name: Publish contracts

# Pousse les contrats de la version taguée vers le registre Portaki.
#
# Sans eux, la plateforme dev ne peut valider ni un manifeste ni un arbre SDUI contre la version
# qu'un module cible : les deux contrôles de conformité correspondants restent bloqués.
#
# Auth : jeton OIDC de GitHub Actions, comme la publication crates.io juste à côté. Aucun secret
# longue durée. Ce que le jeton de ce job affirme, et que le registre doit exiger :
#
#   repository_id     celui de PortakiApp/portaki-sdk
#   event_name        push
#   ref               refs/tags/v<version publiée>
#   job_workflow_ref  PortakiApp/portaki-sdk/.github/workflows/publish-contracts.yml@refs/tags/v<version>
#   environment       contracts
#
# D'où : aucun déclenchement manuel, et la version publiée est celle du tag, jamais une entrée.
# Rejouer après une indisponibilité du registre = « Re-run jobs » sur le run du tag : même
# événement, même ref, nouveau jeton.
#
# Séparé de `publish-crates.yml` à dessein : un registre indisponible ne doit pas empêcher une
# publication crates.io, ni l'inverse.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-contracts
  # Pas d'annulation : une publication interrompue laisserait une version à moitié poussée au
  # registre, et une version publiée ne se republie pas.
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # N'accepte que les tags `v*` (règle de l'environment) ; le registre exige ce nom dans le jeton.
    environment: contracts
    steps:
      - uses: actions/checkout@v7

      # La version est celle du tag : le script refuse un Cargo.toml qui ne la porte pas.
      - name: Assemble the bundle
        id: bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/build-contracts-bundle.mjs "${TAG#v}" > bundle.json
          echo "version=$(node -e 'process.stdout.write(require("./bundle.json").version)')" >> "$GITHUB_OUTPUT"
          echo "Bundle: $(wc -c < bundle.json) octets"

      - name: Publish to the registry
        env:
          REGISTRY_URL: ${{ vars.PORTAKI_REGISTRY_URL || 'https://api.portaki.app' }}
          OIDC_AUDIENCE: ${{ vars.PORTAKI_REGISTRY_OIDC_AUDIENCE || 'https://api.portaki.app/registry' }}
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          set -euo pipefail

          # L'audience est demandée par l'appelant : elle lie le jeton à ce service, elle ne
          # prouve rien sur l'identité. Ce sont les claims listés en tête que le registre vérifie.
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))')

          status=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "${REGISTRY_URL%/}/registry/v1/sdk-releases" \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            --data @bundle.json)

          echo "HTTP $status"
          cat response.json

          case "$status" in
            201) echo "::notice::contrats $VERSION publiés" ;;
            # Déjà publiés : le cas d'un rejeu, pas une erreur. Les contrats sont immuables.
            200) echo "::notice::contrats $VERSION déjà au registre" ;;
            *)   echo "::error::le registre a refusé les contrats ($status)"; exit 1 ;;
          esac
