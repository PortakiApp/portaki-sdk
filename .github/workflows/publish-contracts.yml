name: Publish contracts

# Pushes the tagged version's contracts to the Portaki registry.
#
# Without them, the dev platform can validate neither a manifest nor an SDUI tree against the
# version a module targets: the two matching conformance checks stay blocked.
#
# Auth: GitHub Actions OIDC token, like the crates.io publication right next door. No long-lived
# secret. What this job's token asserts, and what the registry must require:
#
#   repository_id     that of PortakiApp/portaki-sdk
#   event_name        push
#   ref               refs/tags/v<published version>
#   job_workflow_ref  PortakiApp/portaki-sdk/.github/workflows/publish-contracts.yml@refs/tags/v<version>
#   environment       contracts
#
# Hence: no manual trigger, and the published version is the tag's, never an input. Replaying
# after a registry outage means "Re-run jobs" on the tag's run: same event, same ref, new token.
#
# Kept separate from `publish-crates.yml` on purpose: an unavailable registry must not block a
# crates.io publication, nor the other way round.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-contracts
  # No cancellation: an interrupted publication would leave a version half-pushed to the
  # registry, and a published version cannot be published again.
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only accepts `v*` tags (an environment rule); the registry requires this name in the token.
    environment: contracts
    steps:
      - uses: actions/checkout@v7

      # The version is the tag's: the script rejects a Cargo.toml that does not carry it.
      - name: Assemble the bundle
        id: bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/build-contracts-bundle.mjs "${TAG#v}" > bundle.json
          echo "version=$(node -e 'process.stdout.write(require("./bundle.json").version)')" >> "$GITHUB_OUTPUT"
          echo "Bundle: $(wc -c < bundle.json) bytes"

      - name: Publish to the registry
        env:
          REGISTRY_URL: ${{ vars.PORTAKI_REGISTRY_URL || 'https://api.portaki.app' }}
          OIDC_AUDIENCE: ${{ vars.PORTAKI_REGISTRY_OIDC_AUDIENCE || 'https://api.portaki.app/registry' }}
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          set -euo pipefail

          # The audience is chosen by the caller: it binds the token to this service, it proves
          # nothing about identity. It is the claims listed at the top that the registry checks.
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))')

          status=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "${REGISTRY_URL%/}/registry/v1/sdk-releases" \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            --data @bundle.json)

          echo "HTTP $status"
          cat response.json

          case "$status" in
            201) echo "::notice::contracts $VERSION published" ;;
            # Already published: this is a replay, not an error. Contracts are immutable.
            200) echo "::notice::contracts $VERSION already in the registry" ;;
            *)   echo "::error::the registry rejected the contracts ($status)"; exit 1 ;;
          esac
